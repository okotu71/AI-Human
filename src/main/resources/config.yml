# =========================================================
# AI-Human - configuration (v1.03)
# =========================================================

# Which profile to use: "prod" or "test" (see the "prod" / "test" blocks
# below - each one bundles BOTH the MySQL connection AND the Ollama docking
# address for that environment). Can be overridden without touching this
# file via a JVM system property when starting the server, which takes
# precedence over this value:
#   -Dokotu.profile=test
active-profile: "prod"

prod:
  mysql-host: "ip_server"
  mysql-port: 3306
  mysql-database: "okotu_npc_ai"
  mysql-username: "usr"
  mysql-password: "psw"
  # Optional prefix prepended to every table name (e.g. "srv1_" -> "srv1_npc_profiles").
  # Leave empty ("") to use the plain table names shown in schema.sql.
  mysql-table-prefix: ""
  # Ollama docking used for this profile (address/port of the egg set up earlier).
  ollama-host: "127.0.0.1"
  ollama-port: 11434

test:
  mysql-host: "ip_server"
  mysql-port: 3306
  mysql-database: "okotu_npc_ai_test"
  mysql-username: "usr"
  mysql-password: "psw"
  mysql-table-prefix: ""
  # You can point this at a separate test Ollama docking, or reuse the same one.
  ollama-host: "127.0.0.1"
  ollama-port: 11434

# Shared connection-pool settings (apply to whichever profile is active).
mysql-pool-size: 10
mysql-extra-params: "useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC"

ollama:
  # Model used for actual NPC dialogue. Unlike earlier versions, this is now
  # the ONLY place the model is chosen - there is no more per-NPC override in
  # npc_profiles (see "What's new in 1.04" in the README). Swap it for e.g.
  # "gemma3:1b" to change every NPC's model at once.
  # NOTE: Ollama model tags are conventionally lowercase (e.g. "qwen2.5:0.5b").
  # This is set to "Qwen2.5:0.5b" (capital Q) exactly as requested - if NPCs
  # start failing with a "model not found" error, run `ollama list` on the
  # docking server and check the tag's exact casing there.
  default-model: "Qwen2.5:0.5b"
  # Model used for the periodic memory-compression summarization calls.
  # Leave empty ("") to reuse default-model.
  summary-model: ""
  # Request timeout for normal NPC dialogue, after which the fallback
  # response kicks in. Does NOT apply to memory-compression summaries -
  # see summary-timeout-ms below, which needs to be a lot higher since
  # summaries generate far more tokens (summary-num-predict) than a short
  # in-character reply (num-predict) and so simply take longer to finish.
  timeout-ms: 8000
  # Extra attempts on network error/timeout (0 = no retries).
  max-retries: 1
  retry-delay-ms: 500
  # How long Ollama keeps the model loaded in memory after this request
  # (avoids a slow reload on the next message). Same syntax Ollama accepts
  # elsewhere: "30m", "1h", "-1" (forever), "0" (unload immediately).
  keep-alive: "30m"
  # Caps how many tokens the model is allowed to generate per reply - the
  # single biggest lever for response speed. NPC replies are meant to be
  # short (2-3 sentences), so a low value here is normally NOT a quality
  # tradeoff, just a safety/speed cap.
  num-predict: 24
  # Same idea, but for the periodic memory-compression call (SummaryService):
  # summaries need room for up to ~summary-max-words words, so this stays
  # much higher than num-predict above. If you raise conversation.summary-max-words
  # a lot, raise this too or summaries will get cut off mid-sentence.
  summary-num-predict: 250
  # Timeout for the summarization call specifically (see timeout-ms above
  # for the normal-dialogue one). Generating ~400 tokens legitimately takes
  # longer than a short reply, especially on a small/CPU-only model - if you
  # see "request timed out" warnings coming from SummaryService in the
  # console, raise this (and/or lower summary-num-predict / summary-max-words).
  summary-timeout-ms: 30000
  # Sampling temperature: lower = more consistent/predictable, higher = more
  # varied/creative. 0.7 is a reasonable middle ground for in-character chat.
  temperature: 0.7

  # ---------------------------------------------------------------------
  # Performance tuning (llama.cpp options, passed through to Ollama as-is).
  # These are the knobs that most affect how fast a reply comes back,
  # especially on the CPU-only docking set up via the Pterodactyl egg.
  # ---------------------------------------------------------------------

  # Context window size in tokens (prompt + history + generated reply all
  # count against this). The assembled prompt (character sheet + memory +
  # knowledge + village context) is designed to stay in the 300-500 token
  # range, so a smaller-than-model-default context speeds up prompt
  # processing and uses less RAM without losing anything for normal
  # dialogue. Raise it only if replies look like they're missing context
  # (e.g. you set knowledge-limit/village-events-limit high, or write very
  # long backstories/system prompts).
  num-ctx: 1024
  # Memory-compression summaries need a bigger window: the transcript being
  # summarized can be up to summary-trigger-messages raw lines, plus the
  # previous summary, plus the summary-prompt instructions. Too small here
  # silently truncates older parts of the conversation before they're even
  # considered for the summary.
  summary-num-ctx: 2048
  # Tokens processed together during prompt evaluation ("prefill"). Higher
  # can speed up prefill on CPU at the cost of more RAM; Ollama's own
  # default is 512, which is a good starting point for a CPU-only docking.
  num-batch: 512
  # CPU threads Ollama may use for this request. 0 = let Ollama auto-detect
  # (usually all visible cores). On a shared/limited container (like the
  # Pterodactyl egg from earlier), explicitly setting this to match the
  # container's actual CPU allocation often performs more predictably than
  # auto-detection, which can over-subscribe on a host shared with other
  # services.
  num-thread: 0
  # GPU layers to offload, if the Ollama docking has a GPU available. 0 =
  # CPU-only (the default egg setup). Only raise this if you know the
  # docking has GPU support - it's a no-op otherwise.
  num-gpu: 0
  # Sampling knobs that (lightly) affect speed too: a smaller top-k/top-p
  # narrows the choices the model has to weigh per token, and a sane
  # repeat-penalty helps prevent the model rambling into repetition and
  # using up its whole num-predict budget for no reason. These match
  # Ollama's own defaults, so they change nothing until you tune them.
  top-k: 40
  top-p: 0.9
  repeat-penalty: 1.1

conversation:
  # How many of the most recent raw messages to include in the "RECENT
  # MESSAGES" section of the prompt (independent from the compression trigger below).
  recent-messages: 20
  # After this many accumulated raw messages (player+npc) since the last
  # compression for a given (npc, player) pair, the plugin asks Ollama to
  # summarize them, merges the result into npc_player_memory.summary, and
  # deletes the compressed rows from npc_dialog_history.
  summary-trigger-messages: 30
  summary-max-words: 200
  # Instruction sent to Ollama when compressing memory. {max_words} is
  # replaced with summary-max-words above.
  summary-prompt: >
    Summarize this conversation in at most {max_words} words, keeping only
    the important facts (promises, gifts, notable events, favors owed). If a
    previous summary is provided, merge the new facts into it instead of
    discarding it.
  # Hard safety cap per (npc, player) pair on npc_dialog_history, in case
  # compression ever fails to keep up. Enforced by the periodic cleanup job.
  max-raw-messages-safety: 90
  cleanup-interval-minutes: 10
  # In-RAM cache (Caffeine) for the "recent messages" read on every prompt build.
  cache-max-entries: 5000
  cache-expire-after-minutes: 30
  # How many active village_events (highest priority first) to inject per prompt.
  village-events-limit: 5
  # How many npc_knowledge rows to inject per prompt.
  knowledge-limit: 20

# Pools used to randomly generate a starter character sheet the FIRST time a
# player ever talks to a given NPC (see RandomProfileGenerator). One entry is
# picked independently from each list. Village and per-NPC model are never
# randomized - see the README "What's new in 1.03" section for why. Edit
# these freely, or use /aihuman profile to override any single NPC afterwards.
npc-defaults:
  roles:
    - "Villager"
    - "Guard"
    - "Wanderer"
    - "Merchant"
    - "Elder"
  personalities:
    - "Friendly but a bit shy."
    - "Gruff on the outside, kind underneath."
    - "Cheerful and talkative."
    - "Cautious around strangers."
    - "Calm and thoughtful."
    - "Blunt and impatient, but fair."
  backgrounds:
    - "Has lived in this village their whole life."
    - "Arrived here a few years ago and doesn't talk much about the past."
    - "Grew up traveling between settlements before settling down here."
    - "Comes from a long line of villagers who helped build this place."
    - "Used to have a very different life before ending up here."
  professions:
    - "Farmer"
    - "Blacksmith"
    - "Innkeeper"
    - "Guard"
    - "Merchant"
    - "Fisherman"
    - "Carpenter"
  speech-styles:
    - "Speaks slowly and deliberately."
    - "Talks fast and often trails off mid-sentence."
    - "Uses simple, plain language."
    - "Has a habit of asking questions back."
    - "Peppers sentences with old sayings."

relationship:
  min: -100
  max: 100
  default: 0
  # Named deltas usable via the public API (AiHumanApi#applyRelationshipAction)
  # and via "/aihuman relationship <npcId> <player> action:<key>". Feel free
  # to add your own keys here and reference them from other plugins/commands.
  actions:
    bought-item: 5
    saved-villager: 15
    stole: -20
    killed-villager: -40

interaction:
  # How a conversation with an NPC gets started. Both can be on at once -
  # proximity doesn't replace right-click, it's an alternative way in.
  right-click:
    # Set to false if another plugin on your server hijacks right-click on
    # NPCs/entities (e.g. a "ride on shoulders" plugin) so it stops
    # conflicting with talking to NPCs - proximity below then becomes the
    # only way to start a conversation.
    enabled: true
  proximity:
    # If true, an NPC notices a player who walks close enough and greets
    # them first (AI-generated, in character, aware of relationship/memory)
    # instead of waiting for a click.
    enabled: true
    # How close (in blocks) a player needs to get to trigger a greeting.
    radius: 4.0
    # How often (in ticks; 20 ticks = 1 second) the plugin scans for nearby
    # players. Lower = more responsive greetings, more CPU work.
    check-interval-ticks: 20
    # Minimum time before the same NPC will auto-greet the same player
    # again, so standing near an NPC doesn't repeatedly re-trigger it.
    greet-cooldown-minutes: 5
  # Autonomous movement (1.11+): NPCs that wander the world on their own and
  # approach players themselves instead of standing still waiting to be
  # noticed. Off per-NPC by default even when this whole subsystem is
  # enabled - see /aihuman autonomous <npcId> on. Citizens handles the
  # actual walking/pathfinding (its Navigator); this plugin only decides
  # WHERE to send an NPC and WHEN to approach/talk, never individual steps.
  autonomous:
    # Master switch for the whole subsystem. If false, autonomous is
    # unavailable regardless of any per-NPC setting (NpcBehaviorManager's
    # task doesn't even run).
    enabled: true
    # How often (in ticks; 20 = 1 second) the behavior state machine
    # re-evaluates every autonomous NPC (pick a new destination, check for
    # nearby players, advance WANDERING/APPROACHING/TALKING state). This is
    # NOT how often the NPC's position updates - that's Citizens' own
    # Navigator ticking every server tick as usual; this is just how often
    # this plugin re-decides things like a new destination or a state
    # transition. Lower = more responsive, more CPU work per NPC.
    check-interval-ticks: 40
    # Per-NPC overrides exist for all of these via /aihuman wander /
    # /aihuman autonomous - these are just the defaults for a newly
    # autonomous-enabled NPC.
    default-wander-radius: 500
    default-wander-min-distance: 30
    default-wander-max-distance: 150
    default-detection-radius: 15
    # How close (blocks) the NPC stops from a player it's approaching -
    # close enough to feel like a conversation, not so close it's awkward.
    approach-stop-distance: 2.5
    # Citizens Navigator speed modifier while wandering/approaching (1.0 =
    # the NPC's normal walking speed).
    walk-speed: 1.0
    safety:
      # A candidate destination is rejected (and a new one picked instead)
      # if it fails any of these checks. Validated against the world
      # (blocks, not Citizens' own pathfinding) before ever calling
      # Navigator.setTarget, since Citizens' own obstacle avoidance is
      # about not getting stuck, not about "should an NPC willingly walk
      # into lava" - two different concerns.
      avoid-lava: true
      avoid-deep-water: true
      avoid-cliffs: true
      avoid-fire: true
      # A drop of more than this many blocks below a candidate destination
      # counts as a cliff.
      max-safe-fall-blocks: 3
      # Water deeper than this many blocks (from the surface down to solid
      # ground) counts as "deep water" to avoid.
      max-water-depth: 2
      # How many candidate destinations to try (each re-validated) before
      # giving up for this wander cycle and just trying again next time.
      destination-attempts: 8
  # How long a conversation stays "open" (accepting the player's next chat
  # message as a reply to the NPC, whether opened by right-click or by
  # proximity) before it expires from inactivity.
  chat-capture-timeout-seconds: 30

dialog:
  # World-bubble (1.11+): shows the NPC's line as floating text above its
  # head using Paper's native TextDisplay entity - no hologram plugin
  # required. This is IN ADDITION to the chat message the player already
  # gets, not a replacement for it.
  world-bubble:
    enabled: true
    # How long the bubble stays visible before disappearing.
    duration-seconds: 6
    # How far away (blocks) other players can see the bubble.
    view-range: 24
    # Height above the NPC's own head the text is anchored at.
    height-offset: 0.4

integrations:
  # Pl3xMap (1.12+): shows AI-enabled NPCs as live markers on your Pl3xMap
  # web map. Talks to Pl3xMap purely via reflection (see
  # com.okotu.aihuman.map.Pl3xMapIntegration, adapted from the same bridge
  # used by mc-safeguard's Fabulous Claims/zones map overlay) - no Maven
  # dependency on Pl3xMap, and it simply does nothing (logged clearly) if
  # Pl3xMap isn't installed or its version doesn't match the reflected
  # method names. This is the master on/off switch; see npc-map: below for
  # how the markers themselves look.
  pl3xmap:
    enabled: false

# How AI-enabled NPCs are drawn on the Pl3xMap web map, if
# integrations.pl3xmap.enabled is true. Each NPC is drawn as a small square
# (there's no confirmed-safe icon/point marker API to build against yet -
# see the README "What's new in 1.12" - so a small colored rectangle
# centered on the NPC is the honest, working option for now).
npc-map:
  enabled: true
  # Verbose [AI-Human] log lines about exactly which Pl3xMap
  # classes/methods were found via reflection, and why a marker update was
  # skipped, if any. Turn back off once confirmed working - it's chatty.
  debug: false
  # How often (seconds) to re-draw every AI-enabled NPC's marker position.
  # NOT every tick: autonomous NPCs move continuously while wandering, so
  # this is a deliberately low-frequency poll rather than a per-step update.
  refresh-interval-seconds: 10
  # Width/depth (blocks) of the square drawn on the map when icon mode (below)
  # isn't available, centered on the NPC.
  marker-size: 1.0
  # If true, draws each NPC as a small generated "person" icon (a colored
  # head+body silhouette, not the NPC's actual skin/face - see NpcIconFactory)
  # instead of a plain square, IF this Pl3xMap version supports icon markers
  # (detected automatically via reflection - see the README "What's new in
  # 1.15"). Falls back to the square automatically if icon markers aren't
  # available, so this is safe to leave on either way.
  icon-mode: true
  stationary:
    border:
      enabled: true
      width: 2
      color: "#3388FF"
    fill:
      enabled: true
      opacity: 0.5
      color: "#3388FF"
  autonomous:
    border:
      enabled: true
      width: 2
      color: "#33CC33"
    fill:
      enabled: true
      opacity: 0.5
      color: "#33CC33"
  # Since 1.16: styled like a Minecraft player nameplate (dark rounded label,
  # name only, a row of hearts underneath reflecting the NPC's actual
  # health if it's damageable) instead of Pl3xMap's plain white tooltip box.
  tooltip:
    enabled: true

rate-limit:
  # Minimum time between two AI requests from the same player, in milliseconds.
  per-player-cooldown-ms: 3000

fallback:
  enabled: true
  messages:
    - "*The NPC nods absentmindedly and doesn't seem to follow what you're saying.*"
    - "*The NPC is busy and only grunts in reply.*"
    - "*The NPC stares at you in silence for a moment, then changes the subject.*"

debug:
  # When true, logs the full request sent to Ollama (model, system prompt,
  # message history) and the raw response received, to the server console at
  # INFO level, prefixed "[Ollama DEBUG]". Useful to check exactly what the
  # NPC "sees" and says, but very noisy and may log conversation content to
  # the console/log files - leave off in normal production use.
  log-ollama-communication: false
