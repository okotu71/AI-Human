name: AI-Human
version: '${project.version}'
main: com.okotu.aihuman.AiHumanPlugin
api-version: '1.20'
author: okotu71
website: https://github.com/okotu71/AI-Human
description: AI dialogue engine for Citizens NPCs, backed by Ollama and MySQL persistence.

depend: [Citizens]

commands:
  aihuman:
    description: Admin commands for AI-Human
    usage: /aihuman <reload|profile|knowledge|event|relationship|state|enable|disable|autonomous|wander|behavior|version|info>
    permission: aihuman.admin

permissions:
  aihuman.admin:
    description: Allows managing the plugin (reload, per-NPC configuration)
    default: op
  aihuman.talk:
    description: Allows talking to NPCs managed by the plugin
    default: true
